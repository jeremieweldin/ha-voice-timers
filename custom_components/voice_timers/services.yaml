start:
  name: Start timer
  description: Start a named (or unnamed) voice timer in the next free slot.
  fields:
    label:
      name: Label
      description: Optional name for the timer (e.g. "washer"). Leave blank for an unnamed timer.
      example: "washer"
      selector:
        text:
    minutes:
      name: Minutes
      description: Duration in minutes.
      required: true
      example: 10
      selector:
        number:
          min: 0.1
          max: 1440
          step: 0.1
          mode: box

cancel:
  name: Cancel timer
  description: Cancel a running named timer by label.
  fields:
    label:
      name: Label
      description: The label of the timer to cancel.
      required: true
      example: "washer"
      selector:
        text:

stop_ringing:
  name: Stop ringing
  description: Silence any timer(s) currently repeating their "finished" announcement.
